<!doctype html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>AI Agent Hub</title><link rel="stylesheet" href="./style.css?v=28"/></head><body><main class="shell"><section class="card"><div class="brand">AI Agent Hub</div><p class="muted">Единый вход в ваш Hub и память AI-агентов</p><div id="auth"><div class="tabs"><button id="tabLogin" class="active" type="button">Вход</button><button id="tabSignup" type="button">Регистрация</button></div><form id="form"><label>Email<input id="email" type="email" autocomplete="email" required/></label><label>Пароль<input id="password" type="password" minlength="6" required/></label><button id="submit" class="primary" type="submit">Войти</button></form><button id="resend" type="button" hidden>Отправить письмо подтверждения повторно</button><p id="message" class="message"></p></div><div id="account" hidden><div class="status">● Hub Core подключён</div><dl><dt>Email</dt><dd id="userEmail"></dd></dl><div id="bootstrap"><p class="muted">Первый агент Hub</p><button id="bootstrapAgent" class="primary" type="button">Подключить Agent A</button><p id="bootstrapMessage" class="message"></p><div id="agentInfo" hidden><dl><dt>Agent</dt><dd id="agentName"></dd><dt>Agent ID</dt><dd id="agentId"></dd><dt>E2E</dt><dd id="e2eStatus"></dd></dl></div></div><button id="logout" class="primary">Выйти</button></div></section></main><script src="./config.js?v=12"></script><script src="./app.js?v=29"></script></body></html>
