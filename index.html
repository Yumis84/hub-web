<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>AI Agent Hub</title><link rel="stylesheet" href="./style.css"/></head>
<body><main class="shell"><section class="card"><div class="brand">AI Agent Hub</div><p class="muted">Единый вход в ваш Hub и память AI-агентов</p>
<div id="auth"><div class="tabs"><button id="tabLogin" class="active">Вход</button><button id="tabSignup">Регистрация</button></div>
<form id="form"><label id="nameWrap" hidden>Имя<input id="name" autocomplete="name"/></label><label>Email<input id="email" type="email" autocomplete="email" required/></label><label>Пароль<input id="password" type="password" minlength="6" autocomplete="current-password" required/></label><button id="submit" class="primary" type="submit">Войти</button></form><p id="message" class="message"></p></div>
<div id="account" hidden><div class="status">● Hub Core подключён</div><dl><dt>Email</dt><dd id="userEmail"></dd><dt>User ID</dt><dd id="userId"></dd></dl><button id="logout" class="primary">Выйти</button></div>
</section></main><script src="./config.js"></script><script type="module" src="./app.js"></script></body></html>
