<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>AI Agent Hub — OAuth consent</title><link rel="stylesheet" href="./style.css?v=30"/></head>
<body><main class="shell"><section class="card"><div class="brand">AI Agent Hub</div><div id="banner" class="status">Acceptance OAuth</div><p class="muted">Разрешение доступа AI-агенту</p><div id="state"><p id="message">Проверяю OAuth-запрос…</p><div id="details" hidden><dl><dt>Клиент</dt><dd id="clientName"></dd><dt>Redirect URI</dt><dd id="redirectUri"></dd><dt>Запрошенные права</dt><dd id="scope"></dd></dl><button id="approve" class="primary">Разрешить</button><button id="deny" class="primary" style="background:#667085">Отклонить</button></div></div></section></main>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const projectUrl="https://trrhyahuzqbozxanaczw.supabase.co";
const publishableKey="sb_publishable_gJ2s1m3TcfLlVymFoOHfkQ_iMxO7rB5";
const sharedStorage={getItem:k=>localStorage.getItem(k),setItem:(k,v)=>localStorage.setItem(k,v),removeItem:k=>localStorage.removeItem(k)};
const supabase=createClient(projectUrl,publishableKey,{auth:{persistSession:true,storage:sharedStorage,storageKey:"hub_acceptance_supabase_auth"}});
const rawAccess=localStorage.getItem("hub_acceptance_access_token"),rawRefresh=localStorage.getItem("hub_acceptance_refresh_token");
if(rawAccess){const {data:{session}}=await supabase.auth.getSession();if(!session?.access_token){const {error:setError}=await supabase.auth.setSession({access_token:rawAccess,refresh_token:rawRefresh||""});if(setError)console.warn("Acceptance session bridge:",setError.message)}}
const $=s=>document.querySelector(s), id=new URLSearchParams(location.search).get("authorization_id");
function fail(x){$("#message").textContent="OAuth: "+x;$("#details").hidden=true}
if(!id){fail("отсутствует authorization_id")}else{
 const {data:{user}}=await supabase.auth.getUser();
 if(!user){const ret="oauth-consent.html?authorization_id="+encodeURIComponent(id);location.href="./?mode=acceptance&oauth_return="+encodeURIComponent(ret)}
 else{
  const {data,error}=await supabase.auth.oauth.getAuthorizationDetails(id);
  if(error||!data)fail(error?.message||"запрос не найден");
  else if(!("authorization_id" in data)){location.assign(data.redirect_url)}
  else{
   $("#message").textContent="Проверьте приложение и явно разрешите или отклоните доступ.";
   $("#clientName").textContent=data.client?.name||"—";$("#redirectUri").textContent=data.redirect_uri||"—";$("#scope").textContent=data.scope||"—";$("#details").hidden=false;
   $("#approve").onclick=async()=>{const {data:r,error:e}=await supabase.auth.oauth.approveAuthorization(id);if(e)return fail(e.message);location.assign(r.redirect_url)};
   $("#deny").onclick=async()=>{const {data:r,error:e}=await supabase.auth.oauth.denyAuthorization(id);if(e)return fail(e.message);location.assign(r.redirect_url)};
  }
 }
}
</script></body></html>
